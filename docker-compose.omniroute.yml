version: "3.8"

services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    ports:
      - "20128:20128"
    environment:
      # API Keys (from .env or Render secrets)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

      # OmniRoute config
      OMNIROUTE_PORT: "20128"
      OMNIROUTE_LOG_LEVEL: "info"

      # Token compression: aggressive (30-40% reduction)
      OMNIROUTE_COMPRESSION: "aggressive"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20128/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - kokpit-network

networks:
  kokpit-network:
    driver: bridge
